name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/publish.yml"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
          scope: "@cynnie"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "@cynnie/ui-*" build

      # 对比本地版本与 npm registry 上已发布版本，只发布有变化的包
      - name: Publish packages whose version changed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          published=0
          for pkg in ui-core ui-antd ui-element ui-shadcn; do
            name="@cynnie/$pkg"
            local_version=$(node -p "require('./packages/$pkg/package.json').version")
            remote_version=$(npm view "$name" version 2>/dev/null || echo "none")
            if [ "$local_version" = "$remote_version" ]; then
              echo "$name@$local_version already published, skipping"
            else
              echo "Publishing $name@$local_version (registry has: $remote_version)"
              pnpm --filter "$name" publish --no-git-checks --access public
              published=$((published+1))
            fi
          done
          if [ "$published" -eq 0 ]; then
            echo "No version changes to publish."
          fi
